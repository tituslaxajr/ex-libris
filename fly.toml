# Fly.io deploy config. See the README "Launch (self-host)" section.
# Rename `app` to something globally unique before `fly deploy`.
app = "ex-libris"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "file:/data/exlibris.db"
  UPLOAD_DIR = "/data/uploads"
  AI_PROVIDER = "anthropic"
  # Secrets (ANTHROPIC_API_KEY, APP_PASSCODE) are set with `fly secrets set`, not here.

[[mounts]]
  source = "exlibris_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/api/ai/status"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
