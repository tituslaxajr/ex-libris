# Run Ex Libris anywhere Docker runs:  docker compose up -d
services:
  ex-libris:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # The volume holds the database and uploaded books.
      DATABASE_URL: file:/data/exlibris.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - exlibris-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ai/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  exlibris-data:
